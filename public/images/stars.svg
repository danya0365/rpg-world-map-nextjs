<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Small stars -->
  <circle cx="20" cy="15" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="40" cy="30" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="65" cy="10" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="80" cy="25" r="0.5" fill="white" opacity="0.4"/>
  <circle cx="15" cy="55" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="35" cy="70" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="60" cy="85" r="0.5" fill="white" opacity="0.4"/>
  <circle cx="85" cy="60" r="0.8" fill="white" opacity="0.7"/>
  <circle cx="10" cy="90" r="0.6" fill="white" opacity="0.5"/>
  <circle cx="90" cy="95" r="0.7" fill="white" opacity="0.6"/>
  
  <!-- Medium stars with glow -->
  <circle cx="25" cy="40" r="1.2" fill="white" opacity="0.9"/>
  <circle cx="25" cy="40" r="2.5" fill="url(#starGlow)" opacity="0.4"/>
  
  <circle cx="75" cy="45" r="1.1" fill="white" opacity="0.8"/>
  <circle cx="75" cy="45" r="2.2" fill="url(#starGlow)" opacity="0.3"/>
  
  <circle cx="50" cy="75" r="1.3" fill="white" opacity="0.9"/>
  <circle cx="50" cy="75" r="2.6" fill="url(#starGlow)" opacity="0.4"/>
  
  <!-- Large bright star -->
  <circle cx="50" cy="25" r="1.8" fill="white"/>
  <circle cx="50" cy="25" r="3.5" fill="url(#starGlow)" opacity="0.6"/>
</svg>
